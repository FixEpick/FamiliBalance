name: Android CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Lint
      run: ./gradlew lint

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Build Debug APK
      run: ./gradlew assembleDebug

  # Негативный тест guard'а: release-сборка без key.properties ОБЯЗАНА падать.
  # Если assembleRelease вдруг проходит — guard сломан, job валит CI.
  test-release-guard:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: assembleRelease must fail without key.properties
      id: release_guard
      continue-on-error: true
      run: |
        set -o pipefail
        ./gradlew assembleRelease 2>&1 | tee release_build.log

    - name: Verify guard failed with expected error
      run: |
        if [ "${{ steps.release_guard.outcome }}" != "failure" ]; then
          echo "FAIL: assembleRelease прошёл успешно — guard key.properties сломан!"
          exit 1
        fi
        if ! grep -q "key.properties отсутствует" release_build.log; then
          echo "FAIL: сборка упала, но не с ожидаемой ошибкой guard'а:"
          cat release_build.log
          exit 1
        fi
        echo "OK: release guard заблокировал сборку, как и ожидалось."
